<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">BBuidl Lab mascot family</title>
  <desc id="desc">Five friendly floppy-eared builder mascots in a cohesive cream, plum, coral and yellow palette.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#37132d" flood-opacity=".18"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#74153e"/><stop offset="1" stop-color="#a71f55"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9ed"/><stop offset="1" stop-color="#ecdcc9"/></linearGradient>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0d9ee"/><stop offset="1" stop-color="#c99aca"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8f0dd"/><stop offset="1" stop-color="#91c9ae"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd8c2"/><stop offset="1" stop-color="#ee936c"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a8"/><stop offset="1" stop-color="#f4c958"/></linearGradient>
    <style>
      .ink{stroke:#32152e;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
      .face{fill:#32152e}
      .label{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff9ed}
      .small{font-size:20px;letter-spacing:3px;font-weight:700}
      .name{font-size:34px;font-weight:800}
    </style>
  </defs>
  <rect width="1600" height="1000" rx="42" fill="url(#bg)"/>
  <path d="M-30 220C260 60 410 250 650 100S1090 70 1630 250" fill="none" stroke="#d66a87" stroke-opacity=".35" stroke-width="26"/>
  <path d="M-30 820C230 650 450 900 710 760s470-80 920 110" fill="none" stroke="#f7cc65" stroke-opacity=".28" stroke-width="22"/>
  <text x="86" y="92" class="label small">BBUIDL LAB · MASCOT SYSTEM</text>
  <text x="86" y="143" class="label name">Build curious. Ship kindly.</text>

